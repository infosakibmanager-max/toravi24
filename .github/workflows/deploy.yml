name: Deploy TORAVI24 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # When deploying to a custom domain (e.g. toravi24.com), BASE_PATH should be "/"
          # If deploying to username.github.io/repo-name/, set BASE_PATH to "/repo-name/"
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || '' }}
          VITE_ALLOW_INDEXING: 'false'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

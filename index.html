<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TORAVI24 — AI-Researched, Human-Verified Global News</title>
    <meta
      name="description"
      content="TORAVI24 is an international digital news channel turning primary-source intelligence into clear, verified, actionable journalism across world affairs, politics, technology, climate, science, business and security."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Prevent light/dark theme flash before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('toravi24-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
